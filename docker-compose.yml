
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: babystore-app:dev
    container_name: babystore-php
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - postgres
      - redis
    networks:
      - babystore

  nginx:
    image: nginx:alpine
    container_name: babystore-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - babystore

  postgres:
    image: postgres:18
    container_name: babystore-postgres
    environment:
      POSTGRES_DB: babystore
      POSTGRES_USER: babystore
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - babystore

  redis:
    image: redis:alpine
    container_name: babystore-redis
    networks:
      - babystore

networks:
  babystore:

volumes:
  postgres_data: