
name: Baby Store CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Laravel Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: babystore_test
          POSTGRES_USER: babystore
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U babystore -d babystore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: babystore_test
      DB_USERNAME: babystore
      DB_PASSWORD: test_password
      CACHE_STORE: file
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql, bcmath, pcntl, zip, xml, curl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run Laravel tests
        run: php artisan test

  deploy:
    name: Deploy through AWS Systems Manager
    runs-on: ubuntu-latest
    needs: test

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::316286256252:role/GitHubActions-BabyStore-Deploy
          aws-region: ap-south-1
          role-session-name: BabyStoreGitHubDeploy

      - name: Deploy application on EC2
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_SCRIPT=$(cat <<'SCRIPT'
          set -eu

          sudo -u ec2-user bash -lc 'cd /home/ec2-user/babystore && git fetch origin main && git reset --hard origin/main'

          cd /home/ec2-user/babystore

          docker compose -f docker-compose.prod.yml build app
          docker compose -f docker-compose.prod.yml up -d

          docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force
          docker compose -f docker-compose.prod.yml exec -T app php artisan optimize:clear

          curl -fsS http://localhost/api/products
          SCRIPT
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-040d28857f86a48c4" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions Baby Store deployment" \
            --timeout-seconds 900 \
            --parameters "$(jq -cn --arg cmd "$DEPLOY_SCRIPT" '{commands:[$cmd]}')" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-040d28857f86a48c4" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "i-040d28857f86a48c4" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "i-040d28857f86a48c4" \
                  --query "StandardErrorContent" \
                  --output text || true
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for the EC2 deployment."
          exit 1
